<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 · 메모장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container narrow">
    <h1>회원가입</h1>

    <form th:action="@{/signup}" th:object="${form}" method="post" class="card">
        <label for="username">아이디</label>
        <input id="username" th:field="*{username}" type="text" autocomplete="username" autocapitalize="off"
               placeholder="영문, 숫자, _ 4~20자">
        <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

        <label for="password">비밀번호</label>
        <input id="password" th:field="*{password}" type="password" autocomplete="new-password" placeholder="8자 이상">
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <label for="passwordConfirm">비밀번호 확인</label>
        <input id="passwordConfirm" th:field="*{passwordConfirm}" type="password" autocomplete="new-password">
        <p class="field-error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>

        <button type="submit" class="primary">가입하기</button>
    </form>

    <p class="center">이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
</main>
</body>
</html>
