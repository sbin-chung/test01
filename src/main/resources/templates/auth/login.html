<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 · 메모장</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container narrow">
    <h1>로그인</h1>

    <p class="notice success" th:if="${message}" th:text="${message}">가입 완료</p>
    <p class="notice error" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
    <p class="notice success" th:if="${param.logout}">로그아웃되었습니다.</p>

    <form th:action="@{/login}" method="post" class="card">
        <label for="username">아이디</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" required>

        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>

        <button type="submit" class="primary">로그인</button>
    </form>

    <p class="center">계정이 없으신가요? <a th:href="@{/signup}">회원가입</a></p>
</main>
</body>
</html>
